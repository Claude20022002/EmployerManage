# Reverse proxy pour docker-compose.prod.yml : termine le TLS, route /api/ et /admin/ vers
# Django, le reste vers le frontend React. Seul ce service publie 80/443 sur l'hôte.

server {
    listen 80;
    server_name _;
    # Tout le trafic HTTP est redirigé en HTTPS, sauf le challenge ACME (Let's Encrypt) si vous
    # automatisez le renouvellement de certificat plus tard (non fait ici, voir README ci-contre).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;  # justificatifs uploadés (PDF/images)

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
