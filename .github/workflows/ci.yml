name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-secret-key-not-for-prod
  ATTESTATION_SECRET_KEY: ci-attestation-key-not-for-prod
  DEBUG: "True"
  DATABASE_URL: postgres://employermanage:employermanage@localhost:5432/employermanage
  CORS_ALLOWED_ORIGINS: http://localhost:5173
  CSRF_TRUSTED_ORIGINS: http://localhost:5173
  FRONTEND_URL: http://localhost:5173

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: employermanage
          POSTGRES_USER: employermanage
          POSTGRES_PASSWORD: employermanage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U employermanage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python manage.py test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: employermanage
          POSTGRES_USER: employermanage
          POSTGRES_PASSWORD: employermanage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U employermanage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Migrer et seeder les données de démonstration
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
        working-directory: backend
      - name: Démarrer le backend
        run: nohup python manage.py runserver 8001 > django.log 2>&1 &
        working-directory: backend
      - run: curl --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8001/api/health/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - env:
          VITE_API_URL: http://localhost:8001/api
        run: npx playwright test
        working-directory: frontend

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - if: failure()
        run: cat backend/django.log
