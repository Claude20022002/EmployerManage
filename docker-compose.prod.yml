# Démonstration de stack conteneurisée complète (backend + frontend + PostgreSQL + reverse proxy
# TLS + sauvegardes). Toujours pas un déploiement production clé en main : pas de renouvellement
# automatique de certificat, sauvegardes stockées localement uniquement (pas de copie vers un
# stockage distant) — voir docs/03-architecture.md.
#
# Utilisation :
#   1. ./proxy/generer-certificat-autosigne.sh   (ou fournir de vrais certificats dans proxy/certs/)
#   2. docker compose -f docker-compose.prod.yml --env-file backend/.env up -d --build
#   3. https://localhost (avertissement navigateur attendu avec un certificat auto-signé)
#
# Le .env du backend (voir backend/.env.example) doit définir DJANGO_SECRET_KEY,
# ATTESTATION_SECRET_KEY et DEBUG=False avant tout usage réel.
#
# `name:` ci-dessous est volontaire : sans lui, Docker Compose nomme le projet d'après le
# dossier courant, IDENTIQUE à celui de docker-compose.yml (postgres de dev) — lancer ce fichier
# recréerait alors le conteneur postgres de dev avec un autre volume, détachant vos données
# locales sans les supprimer (elles restent dans le volume `employermanage_postgres-data`, juste
# débranché). Vécu une fois pendant le développement de ce projet — d'où ce commentaire.
name: employermanage-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: employermanage
      POSTGRES_USER: employermanage
      POSTGRES_PASSWORD: employermanage
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employermanage"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://employermanage:employermanage@postgres:5432/employermanage
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY doit être défini}
      ATTESTATION_SECRET_KEY: ${ATTESTATION_SECRET_KEY:?ATTESTATION_SECRET_KEY doit être défini}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - backend-media:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        # Le frontend appelle l'API via le même domaine que la page (routé par le proxy en /api/) :
        # pas besoin d'exposer un port backend séparé au navigateur.
        VITE_API_URL: ${VITE_API_URL:-/api}

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

  backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: employermanage
      POSTGRES_USER: employermanage
      POSTGRES_PASSWORD: employermanage
      BACKUP_INTERVAL_HEURES: ${BACKUP_INTERVAL_HEURES:-24}
      BACKUP_RETENTION_JOURS: ${BACKUP_RETENTION_JOURS:-14}
    volumes:
      - ./backup:/scripts:ro
      - backup-data:/backups
    entrypoint: ["sh", "/scripts/sauvegarder.sh"]

volumes:
  postgres-data-prod:
  backend-media:
  backup-data:
